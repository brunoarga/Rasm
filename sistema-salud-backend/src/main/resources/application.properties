
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_salud?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Flyway (replaces ddl-auto + data.sql)
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:SistemaSalud2026SecretKeyParaFirmarJWTTokenDebeSerMuySegura1234567890}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION_MS:86400000}

# Vínculo institucional: tiempo (horas) sin turno tras derivación antes de escalar
app.escalamiento.horas=${ESCALAMIENTO_HORAS:48}

# Alertas por demora: ventana (horas) sin respuesta del centro antes de generar alerta de reasignación
app.alerta.horas=${ALERTA_HORAS:24}

# WhatsApp Business API (Meta Cloud API). Si no se configuran, el sistema degrada a email/log.
whatsapp.enabled=${WHATSAPP_ENABLED:false}
whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com/v18.0}
whatsapp.language=${WHATSAPP_LANGUAGE:es_AR}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=${SERVER_PORT:8085}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cache (Redis)
spring.cache.type=${CACHE_TYPE:none}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.flyway.repair-on-migrate=true

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Logging
logging.level.com.sistemasalud=DEBUG
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false